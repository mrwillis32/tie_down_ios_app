# XcodeGen spec for the TieDown iOS app.
# Generate the Xcode project with:  cd apps/ios && xcodegen generate
# (TieDown.xcodeproj is generated — edit this file, not the project.)
name: TieDown
options:
  bundleIdPrefix: us.tiedown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      TD_ENVIRONMENT: dev
      TD_APS_ENVIRONMENT: development
    Staging:
      TD_ENVIRONMENT: staging
      TD_APS_ENVIRONMENT: production
    Release:
      TD_ENVIRONMENT: production
      TD_APS_ENVIRONMENT: production

packages:
  StripeTerminal:
    url: https://github.com/stripe/stripe-terminal-ios
    exactVersion: "5.8.1"

targets:
  TieDown:
    type: application
    platform: iOS
    sources:
      - path: TieDown/Sources
      - path: TieDown/Resources
    dependencies:
      - package: StripeTerminal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.tiedown.app
        PRODUCT_NAME: TieDown
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: TieDown/Info.plist
        CODE_SIGN_ENTITLEMENTS: TieDown/TieDown.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: TieDown/Info.plist
      properties:
        CFBundleDisplayName: TieDown
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        TDEnvironment: $(TD_ENVIRONMENT)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: BrandNavy
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        CFBundleURLTypes:
          - CFBundleURLName: us.tiedown.app
            CFBundleURLSchemes: [tiedown]
        LSApplicationQueriesSchemes: [tel, mailto, sms, maps]
        NSLocationWhenInUseUsageDescription: TieDown uses your location to verify card payments taken with Tap to Pay on iPhone.
        NSCameraUsageDescription: TieDown uses the camera to scan product barcodes and capture photos.
        NSMicrophoneUsageDescription: TieDown uses the microphone for voice commands and dictation.
        NSFaceIDUsageDescription: TieDown uses Face ID to unlock the app quickly and securely.
        NSPhotoLibraryAddUsageDescription: TieDown saves receipts and documents you download to your photo library when you choose to.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
    entitlements:
      path: TieDown/TieDown.entitlements
      properties:
        com.apple.developer.proximity-reader.payment.acceptance: true
        aps-environment: $(TD_APS_ENVIRONMENT)

schemes:
  TieDown:
    build:
      targets:
        TieDown: all
    run:
      config: Debug
    archive:
      config: Release
  TieDown Staging:
    build:
      targets:
        TieDown: all
    run:
      config: Staging
    archive:
      config: Staging
